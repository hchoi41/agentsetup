[pytest]
# Run from this folder: python -P -m pytest   (never -I: openpyxl is in the user site-packages; design D1)
testpaths = scripts/tests
addopts = -p no:cacheprovider
markers =
    excel: needs Microsoft Excel; skipped when Excel is not available, lib.excel is not written yet, or ROTM_NO_EXCEL=1
    slow: takes more than 30 seconds
